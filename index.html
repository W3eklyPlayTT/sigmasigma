<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BtrccStudy — Coming Back Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #04080f;
    --bg2:          #070d1a;
    --surface:      #0b1322;
    --surface2:     #0f1a2e;
    --border:       rgba(255,255,255,0.06);
    --border-glow:  rgba(74,144,245,0.18);
    --blue-mid:     #1a3a6e;
    --blue-accent:  #2d6be4;
    --blue-bright:  #4a90f5;
    --blue-glow:    #6aaeff;
    --blue-pale:    #a8cbff;
    --gold:         #c9a227;
    --gold-light:   #e8c060;
    --gold-pale:    #f5dfa0;
    --gold-border:  rgba(201,162,39,0.45);
    --gold-bg:      rgba(201,162,39,0.08);
    --white:        #ffffff;
    --white-muted:  rgba(255,255,255,0.38);
    --white-faint:  rgba(255,255,255,0.06);
  }

  html, body { height: 100%; width: 100%; overflow-x: hidden; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--white);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
  }

  /* ── BACKGROUND ── */
  .bg-layer {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  .bg-layer::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 45% at 15% 5%,  rgba(29,74,183,0.12) 0%, transparent 65%),
      radial-gradient(ellipse 40% 55% at 85% 90%,  rgba(16,40,100,0.16) 0%, transparent 60%),
      radial-gradient(ellipse 30% 30% at 50% 50%,  rgba(7,13,26,0.85)  0%, transparent 100%);
  }
  .grid-overlay {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(45,107,228,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(45,107,228,0.035) 1px, transparent 1px);
    background-size: 72px 72px;
    mask-image: radial-gradient(ellipse 85% 85% at 50% 50%, black, transparent);
  }
  .orb {
    position: absolute; border-radius: 50%;
    filter: blur(100px); opacity: 0.12;
    animation: drift linear infinite;
  }
  .orb1 { width:600px; height:600px; background:#1e4fa3; top:-200px; left:-150px; animation-duration:25s; }
  .orb2 { width:400px; height:400px; background:#0d2244; bottom:5%; right:-100px; animation-duration:32s; animation-direction:reverse; }
  .orb3 { width:220px; height:220px; background:#c9a227; top:35%; right:20%; animation-duration:18s; opacity:0.05; }
  @keyframes drift {
    0%   { transform:translate(0,0) scale(1); }
    33%  { transform:translate(28px,-18px) scale(1.04); }
    66%  { transform:translate(-18px,28px) scale(0.96); }
    100% { transform:translate(0,0) scale(1); }
  }

  /* ── TOP NAV ── */
  .topnav {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.1rem 2rem;
    border-bottom: 1px solid var(--border);
    background: rgba(4,8,15,0.7);
    backdrop-filter: blur(14px);
  }

  .nav-left {
    display: flex; align-items: center; gap: 0.6rem;
  }
  .status-dot {
    width:8px; height:8px; border-radius:50%;
    background: #f87171;
    box-shadow: 0 0 10px #f87171;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }
  .status-label {
    font-size: 0.68rem; font-weight:600; letter-spacing:0.18em;
    text-transform:uppercase; color: var(--white-muted);
  }

  /* LOGO BOX — golden */
  .logo-box {
    display: flex; align-items: center; gap: 0.75rem;
    background: var(--gold-bg);
    border: 1px solid var(--gold-border);
    border-radius: 10px;
    padding: 0.45rem 0.9rem;
    box-shadow: 0 0 24px rgba(201,162,39,0.12), inset 0 1px 0 rgba(255,220,100,0.08);
    transition: box-shadow 0.35s;
  }
  .logo-box:hover {
    box-shadow: 0 0 40px rgba(201,162,39,0.22), inset 0 1px 0 rgba(255,220,100,0.12);
  }
  .logo-box img {
    height: 36px; width: auto;
    filter: brightness(1.05) drop-shadow(0 0 6px rgba(201,162,39,0.4));
    object-fit: contain;
  }
  .logo-box-label {
    font-size: 0.62rem; font-weight:700; letter-spacing:0.15em;
    text-transform:uppercase;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-pale));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── MAIN WRAPPER ── */
  .wrapper {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1; padding: 3.5rem 1.5rem 2.5rem;
    gap: 2.8rem;
  }

  /* ── HERO ── */
  .hero { text-align:center; display:flex; flex-direction:column; align-items:center; gap:1rem; }

  .eyebrow {
    font-size:0.68rem; font-weight:600; letter-spacing:0.22em;
    text-transform:uppercase; color: var(--blue-pale);
    opacity:0.7;
  }

  .site-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: clamp(3.5rem, 12vw, 8rem);
    font-weight: 700; line-height: 1; letter-spacing:-0.01em;
    background: linear-gradient(160deg, #ffffff 0%, var(--blue-pale) 55%, var(--blue-glow) 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter: drop-shadow(0 0 40px rgba(74,144,245,0.25));
    position: relative;
  }

  .coming-line {
    font-size: clamp(0.85rem, 2.2vw, 1.05rem);
    font-weight: 300; letter-spacing:0.25em;
    text-transform:uppercase; color: var(--white-muted);
  }

  .tagline {
    font-size: clamp(0.88rem, 2vw, 1.05rem);
    font-weight:500; color: rgba(168,203,255,0.65);
    display:flex; align-items:center; gap:0.45rem;
  }
  .heart { color:#f472b6; display:inline-block; animation: hb 1.4s ease-in-out infinite; }
  @keyframes hb { 0%,100%{transform:scale(1);} 14%{transform:scale(1.28);} 28%{transform:scale(1);} 42%{transform:scale(1.14);} }

  /* ── COUNTDOWN ── */
  .countdown-section {
    display:flex; flex-direction:column; align-items:center;
    gap:1.4rem; width:100%; max-width:680px;
  }

  .cd-label {
    font-size:0.65rem; font-weight:600; letter-spacing:0.24em;
    text-transform:uppercase; color: var(--white-muted);
  }

  .cd-grid {
    display:grid; grid-template-columns:repeat(4,1fr);
    gap: clamp(0.55rem,2vw,1.1rem); width:100%;
  }

  .cd-block { display:flex; flex-direction:column; align-items:center; gap:0.55rem; }

  .cd-card {
    position:relative; width:100%;
    aspect-ratio: 1 / 1.1;
    background: linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    box-shadow: 0 2px 24px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .cd-card:hover {
    border-color: var(--border-glow);
    box-shadow: 0 2px 24px rgba(0,0,0,0.55), 0 0 40px rgba(45,107,228,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  /* top shimmer line */
  .cd-card::before {
    content:''; position:absolute; top:0; left:15%; right:15%; height:1px;
    background: linear-gradient(90deg, transparent, rgba(106,174,255,0.22), transparent);
  }
  /* mid divider */
  .cd-card::after {
    content:''; position:absolute; left:0; right:0; top:50%; height:1px;
    background: rgba(0,0,0,0.5); z-index:2;
  }

  .cd-value {
    font-family:'Rajdhani', sans-serif;
    font-size: clamp(2.6rem,8vw,5.5rem);
    font-weight:700; line-height:1; z-index:3; position:relative;
    background: linear-gradient(175deg, #ffffff 35%, var(--blue-pale) 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .cd-value.flip { animation: flipNum 0.3s cubic-bezier(0.4,0,0.2,1); }
  @keyframes flipNum {
    0%   { transform:rotateX(0deg); opacity:1; }
    45%  { transform:rotateX(-90deg); opacity:0; }
    55%  { transform:rotateX(90deg); opacity:0; }
    100% { transform:rotateX(0deg); opacity:1; }
  }

  .cd-unit {
    font-size:0.6rem; font-weight:600; letter-spacing:0.2em;
    text-transform:uppercase; color: var(--white-muted);
  }

  /* seconds card subtle glow */
  .cd-block:last-child .cd-card { border-color: rgba(45,107,228,0.12); }

  /* ── PROGRESS ── */
  .prog-wrap {
    width:100%; max-width:520px;
    display:flex; flex-direction:column; gap:0.55rem;
  }
  .prog-meta {
    display:flex; justify-content:space-between;
    font-size:0.65rem; font-weight:500; letter-spacing:0.1em;
    color: var(--white-muted); text-transform:uppercase;
  }
  .prog-bar {
    width:100%; height:3px;
    background: rgba(255,255,255,0.05);
    border-radius:999px; overflow:hidden;
  }
  .prog-fill {
    height:100%;
    background: linear-gradient(90deg, var(--blue-mid), var(--blue-accent), var(--blue-glow));
    border-radius:999px;
    transition: width 1s linear;
    box-shadow: 0 0 10px rgba(106,174,255,0.5);
  }

  /* ── HASHTAG ── */
  .hashtag-row {
    display:flex; gap:0.7rem; align-items:center; flex-wrap:wrap; justify-content:center;
  }
  .hashtag {
    font-size:clamp(0.85rem,2vw,1rem); font-weight:700;
    color: var(--blue-bright); letter-spacing:0.04em;
    animation: tglow 3s ease-in-out infinite;
  }
  @keyframes tglow {
    0%,100%{ text-shadow:0 0 12px rgba(74,144,245,0.35); }
    50%    { text-shadow:0 0 28px rgba(74,144,245,0.75), 0 0 55px rgba(74,144,245,0.25); }
  }
  .never-dies {
    font-size:clamp(0.8rem,2vw,0.93rem); color: var(--white-muted);
    display:flex; align-items:center; gap:0.3rem;
  }

  /* ── FOOTER ── */
  footer {
    position:relative; z-index:1;
    text-align:center; padding:1rem 1.5rem;
    border-top:1px solid var(--border);
    background: rgba(4,8,15,0.5);
  }
  .watermark {
    font-family: 'Courier New', 'Lucida Console', monospace;
    font-size:clamp(0.65rem,1.6vw,0.78rem);
    color: rgba(106,174,255,0.22);
    letter-spacing:0.1em;
    transition: color 0.4s;
    user-select:none;
  }
  .watermark:hover { color: rgba(106,174,255,0.45); }

  /* ── PARTICLES ── */
  #particles { position:fixed; inset:0; z-index:0; pointer-events:none; }

  /* ── SPOTIFY CARD ── */
  .spotify-card {
    display: flex; align-items: center; gap: 1rem;
    background: #121212;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 0.85rem 1.1rem;
    width: 100%; max-width: 360px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative; overflow: hidden;
  }
  .spotify-card::before {
    content:'';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(29,185,84,0.06) 0%, transparent 60%);
    pointer-events: none;
  }
  .sp-art {
    position: relative; flex-shrink: 0;
    width: 52px; height: 52px;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .sp-art img {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .sp-art-fallback {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.4rem; font-weight: 700;
    color: rgba(255,255,255,0.4);
  }
  .sp-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.18rem; }
  .sp-now-label {
    font-size: 0.58rem; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: #1db954;
    display: flex; align-items: center; gap: 0.35rem;
  }
  .sp-pulse-dots { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
  .sp-pulse-dots span {
    display: block; width: 2px; background: #1db954; border-radius: 1px;
    animation: barBounce 1.1s ease-in-out infinite;
  }
  .sp-pulse-dots span:nth-child(1){ height:4px;  animation-delay: 0s; }
  .sp-pulse-dots span:nth-child(2){ height:8px;  animation-delay: 0.2s; }
  .sp-pulse-dots span:nth-child(3){ height:5px;  animation-delay: 0.4s; }
  .sp-pulse-dots span:nth-child(4){ height:9px;  animation-delay: 0.1s; }
  @keyframes barBounce {
    0%,100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1.1); }
  }
  .sp-title {
    font-size: 0.9rem; font-weight: 600; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sp-artist {
    font-size: 0.75rem; color: rgba(255,255,255,0.5);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sp-progress-wrap { margin-top: 0.45rem; display: flex; flex-direction: column; gap: 4px; }
  .sp-bar-track {
    width: 100%; height: 3px;
    background: rgba(255,255,255,0.12);
    border-radius: 999px; overflow: hidden;
    cursor: pointer;
  }
  .sp-bar-fill {
    height: 100%; width: 0%;
    background: #fff;
    border-radius: 999px;
    transition: background 0.2s;
  }
  .sp-bar-track:hover .sp-bar-fill { background: #1db954; }
  .sp-times {
    display: flex; justify-content: space-between;
    font-size: 0.6rem; color: rgba(255,255,255,0.35);
    font-variant-numeric: tabular-nums;
  }
  .sp-logo {
    flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 2px;
  }
  .sp-logo svg { width: 22px; height: 22px; }

  /* ── RESPONSIVE ── */
  @media(max-width:480px){
    .topnav{ padding:0.85rem 1rem; }
    .logo-box img{ height:28px; }
    .cd-card{ border-radius:10px; }
    .spotify-card{ max-width:100%; }
  }
  @media(prefers-reduced-motion:reduce){ *,*::before,*::after{ animation:none!important; transition:none!important; } }
</style>
</head>

<script>
/* ═══════════════════════════════════
   COUNTDOWN — target: Sept 30 2026
═══════════════════════════════════ */
const TARGET = new Date('2026-09-30T00:00:00');
const START  = new Date('2026-08-25T00:00:00'); // launch date for progress %
const TOTAL  = TARGET - START;

const elDays = document.getElementById('days');
const elHrs  = document.getElementById('hours');
const elMins = document.getElementById('minutes');
const elSecs = document.getElementById('seconds');
const elFill = document.getElementById('prog-fill');
const elPct  = document.getElementById('pct');
const elLbl  = document.getElementById('prog-label');

const prev = { d:'', h:'', m:'', s:'' };

function pad(n){ return String(n).padStart(2,'0'); }

function flip(el, val){
  el.classList.remove('flip');
  void el.offsetWidth;
  el.textContent = val;
  el.classList.add('flip');
}

function tick(){
  const now  = new Date();
  const diff = TARGET - now;

  if(diff <= 0){
    [elDays, elHrs, elMins, elSecs].forEach(e => e.textContent = '00');
    elFill.style.width = '100%';
    elPct.textContent  = '100%';
    elLbl.textContent  = 'We\'re back!';
    return;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000)  / 60000);
  const s = Math.floor((diff % 60000)    / 1000);

  const pd = pad(d), ph = pad(h), pm = pad(m), ps = pad(s);

  if(pd !== prev.d){ flip(elDays, pd); prev.d = pd; }
  if(ph !== prev.h){ flip(elHrs,  ph); prev.h = ph; }
  if(pm !== prev.m){ flip(elMins, pm); prev.m = pm; }
  if(ps !== prev.s){ flip(elSecs, ps); prev.s = ps; }

  const elapsed = Math.max(0, now - START);
  const pct     = Math.min(100, (elapsed / TOTAL) * 100);
  elFill.style.width = pct.toFixed(2) + '%';
  elPct.textContent  = pct.toFixed(1) + '%';
}

tick();
setInterval(tick, 1000);

/* ═══════════════════════════════════
   SPOTIFY PROGRESS BAR
═══════════════════════════════════ */
(function(){
  const DURATION = 208; // 3:28 in seconds
  const spFill   = document.getElementById('sp-fill');
  const spCur    = document.getElementById('sp-cur');
  let elapsed    = 0;

  function fmtTime(s){
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + String(sec).padStart(2,'0');
  }

  function spTick(){
    elapsed = (elapsed + 1) % DURATION;
    const pct = (elapsed / DURATION) * 100;
    spFill.style.width = pct.toFixed(2) + '%';
    spCur.textContent  = fmtTime(elapsed);
  }

  setInterval(spTick, 1000);
})();

/* ═══════════════════════════════════
   PARTICLE SYSTEM
═══════════════════════════════════ */
(function(){
  const canvas = document.getElementById('particles');
  const ctx    = canvas.getContext('2d');
  let W, H, pts;

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function mkPt(){
    return {
      x:  Math.random() * W,
      y:  Math.random() * H,
      r:  Math.random() * 1.2 + 0.2,
      vx: (Math.random() - 0.5) * 0.12,
      vy: -(Math.random() * 0.18 + 0.04),
      a:  Math.random(),
      da: (Math.random() * 0.003 + 0.0008) * (Math.random() < 0.5 ? 1 : -1),
      hue: 210 + Math.random() * 30,
    };
  }

  function init(){
    resize();
    pts = Array.from({length: 90}, mkPt);
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    pts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.a += p.da;
      if(p.a <= 0 || p.a >= 1) p.da *= -1;
      if(p.y < -10){ p.y = H + 5; p.x = Math.random() * W; }
      if(p.x < -10) p.x = W + 5;
      if(p.x > W + 10) p.x = -5;

      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(0.55, p.a * 0.55));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `hsl(${p.hue}, 65%, 72%)`;
      ctx.shadowBlur  = 5;
      ctx.shadowColor = `hsl(${p.hue}, 75%, 68%)`;
      ctx.fill();
      ctx.restore();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init(); draw();
})();
</script>
